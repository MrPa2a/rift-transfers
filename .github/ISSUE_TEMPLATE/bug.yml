name: Display bug
description: Something does not display or respond as it should.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        You can write in French. — *Tu peux écrire en français.*
  - type: textarea
    id: description
    attributes:
      label: What happens
      description: What you did, what you saw, and what you expected instead.
      placeholder: "The Filters drawer does not open on mobile."
    validations:
      required: true
  # The field id is read by assets/js/report.js, which fills it from the map's "Report a display
  # bug" button: keep the two in step.
  - type: textarea
    id: context
    attributes:
      label: Browser, screen and map state
      description: Filled in for you when the report starts from the map's "About" panel. Otherwise, your browser and device are enough.
      placeholder: "Chrome 142, Windows 11"
