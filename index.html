<!doctype html>
<!--
  Redirect to /map/, pending the landing page that will take this place. The root must never be
  an empty page: a link already shared to the root has to lead to the map.

  The path is relative — "map/" and not "/map/" — because the site is served from
  /rift-transfers/ on GitHub Pages and from / in local development.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="./">
  <title>Rift Transfers</title>
  <meta name="description" content="Interactive map of the rosters of every team that came to the 2011–2026 League of Legends World Championships.">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url=map/">
  <link rel="canonical" href="https://mrpa2a.github.io/rift-transfers/map/">
  <!-- Link previews do not follow the redirect: a link shared to the root needs its own card,
       the same as the map's. -->
  <meta property="og:title" content="Rift Transfers">
  <meta property="og:description" content="League of Legends Worlds rosters since 2011, and every player's transfers.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Rift Transfers">
  <meta property="og:url" content="https://mrpa2a.github.io/rift-transfers/map/">
  <meta property="og:image" content="https://mrpa2a.github.io/rift-transfers/assets/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="The Rift Transfers map with Fnatic selected: coloured threads follow its players to other teams, season after season.">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <style>
    html { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font: 400 1rem/1.6 system-ui, sans-serif; text-align: center; padding: 1.5rem;
      background: #ffffff; color: #171b26;
    }
    @media (prefers-color-scheme: dark) { body { background: #171b26; color: #e7e9ee; } }
    a { color: inherit; }
  </style>
</head>
<body>
  <p>Rift Transfers — <a href="map/">open the map</a>.</p>
  <script>
    // The refresh tag is enough, but it loses the query string and the fragment: we carry them
    // over when JavaScript is available, so that a deep link shared to the root arrives whole.
    location.replace("map/" + location.search + location.hash);
  </script>
</body>
</html>
