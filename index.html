<!doctype html>
<!--
  Redirection vers /map/, en attendant la page de présentation qui prendra cette place.
  La racine ne doit jamais être une page vide : un lien déjà partagé vers la racine doit
  mener à la carte.

  Le chemin est relatif — « map/ » et non « /map/ » — parce que le site est servi depuis
  /rift-transfers/ sur GitHub Pages et depuis / en développement local.
-->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="./">
  <title>Rift Transfers</title>
  <meta name="description" content="Carte interactive des rosters de toutes les équipes venues aux Worlds 2011–2026 de League of Legends.">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url=map/">
  <link rel="canonical" href="https://mrpa2a.github.io/rift-transfers/map/">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <style>
    html { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font: 400 1rem/1.6 system-ui, sans-serif; text-align: center; padding: 1.5rem;
      background: #ffffff; color: #171b26;
    }
    @media (prefers-color-scheme: dark) { body { background: #171b26; color: #e7e9ee; } }
    a { color: inherit; }
  </style>
</head>
<body>
  <p>Rift Transfers — <a href="map/">ouvrir la carte</a>.</p>
  <script>
    // La balise refresh suffit, mais elle perd la requête et l'ancre : on les reporte quand
    // JavaScript est là, pour qu'un lien profond partagé vers la racine arrive entier.
    location.replace("map/" + location.search + location.hash);
  </script>
</body>
</html>
