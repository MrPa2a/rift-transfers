<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- La carte vit dans /map/, les données et les assets à la racine du site. Cette balise
       est le seul endroit qui le dit : toutes les URL relatives de la page comme du module
       app.js — dont ses `fetch("data/*.json")` — se résolvent depuis la racine. -->
  <base href="../">
  <title>Rift Transfers</title>
  <!-- Les textes de l'interface vivent dans assets/js/i18n.js, et `data-i18n` dit lequel va où :
       une chaîne n'est écrite qu'une fois, dans les deux langues côte à côte. Les métas, elles,
       portent leur version **anglaise** en dur — c'est la langue par défaut du site, et c'est
       ce que lit un robot qui n'exécute pas le script. `i18n.js` les réécrit au chargement
       comme au changement de langue. -->
  <meta name="description" content="Interactive map of the rosters of every team that came to the 2011–2026 League of Legends World Championships: follow each player from one team to the next.">
  <meta name="theme-color" content="#171b26" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta property="og:title" content="Rift Transfers">
  <meta property="og:description" content="League of Legends Worlds rosters since 2011, and every player's transfers.">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="en_US">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/barlow-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/barlow-condensed-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/styles.css">
  <script type="module" src="assets/js/app.js"></script>
</head>
<body>
<div id="corner" aria-hidden="true" data-i18n="coin.annee"></div>
<div id="hdr"></div>
<div id="rail"></div>
<div id="vp" tabindex="0" data-i18n-attr="aria-label:vp.aria"><div id="world"></div></div>

<div id="bar" class="float">
  <h1>Rift Transfers</h1>
  <!-- Le <datalist> natif ne sait ni présenter deux catégories, ni afficher autre chose que
       du texte, ni être stylé : la barre cherchant maintenant des équipes autant que des
       joueurs, c'est une combobox écrite à la main. -->
  <div class="combo">
    <input id="q" type="text" autocomplete="off" spellcheck="false"
           data-i18n-attr="placeholder:q.aria;aria-label:q.aria"
           role="combobox" aria-expanded="false" aria-controls="qlist" aria-autocomplete="list">
    <div id="qlist" role="listbox" data-i18n-attr="aria-label:qlist.aria" hidden></div>
  </div>
  <button class="ibtn" id="openFilters" type="button" aria-expanded="false" aria-controls="filters" data-i18n-attr="title:btn.filtres.titre">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 4h12M4.5 8h7M7 12h2"/></svg><span data-i18n="btn.filtres"></span></button>
  <button class="ibtn" id="openStats" type="button" aria-expanded="false" aria-controls="statsDrawer" data-i18n-attr="title:btn.stats.titre">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 13V8M8 13V3M13 13V6"/></svg><span data-i18n="btn.stats"></span></button>
  <!-- Deux langues, donc une bascule et non une liste : le bouton porte le code de la langue
       d'**arrivée**, qui est ce qu'il fait. Son libellé reste visible sous 700 px, contrairement
       à ceux des deux boutons voisins — deux lettres tiennent toujours, et un globe seul ne
       dirait pas vers quoi on bascule. -->
  <button class="ibtn" id="lang" type="button" data-i18n-attr="title:btn.lang.titre;aria-label:btn.lang.titre">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="8" cy="8" r="6.2"/><path d="M1.8 8h12.4M8 1.8c1.7 1.7 2.6 3.9 2.6 6.2S9.7 12.5 8 14.2C6.3 12.5 5.4 10.3 5.4 8S6.3 3.5 8 1.8Z"/></svg><span data-i18n="btn.lang.code"></span></button>
</div>

<div id="zoom" class="float">
  <button type="button" id="zin" data-i18n-attr="title:zoom.in;aria-label:zoom.in">+</button>
  <button type="button" id="zout" data-i18n-attr="title:zoom.out;aria-label:zoom.out">−</button>
  <button type="button" id="zfit" data-i18n-attr="title:zoom.fit;aria-label:zoom.fit"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg></button>
  <div class="pct" id="zpct">100%</div>
</div>

<!-- Fermée par défaut : la légende compte une dizaine de lignes et masquait le bas gauche
     de la carte dès l'ouverture. Elle reste à un clic. -->
<details id="legend" class="float">
  <summary data-i18n="legend.titre"></summary>
  <div id="legendBody"></div>
</details>

<div id="sel" class="float" hidden>
  <div id="selText"></div>
  <!-- Isoler est une bascule, pas une action : d'où aria-pressed. Elle vit ici parce que #sel
       est le seul endroit commun aux deux sélections — un joueur se prend dans la carte par
       pointerup, une équipe dans l'en-tête par click, et un geste posé sur la carte laisserait
       le curseur au-dessus d'autre chose une fois les colonnes resserrées. -->
  <button id="selIso" type="button" aria-pressed="false" hidden></button>
  <button id="selClose" type="button" data-i18n-attr="aria-label:sel.fermer">×</button>
</div>

<aside id="filters" class="drawer" data-i18n-attr="aria-label:btn.filtres.titre">
  <div class="dhead"><h2 data-i18n="btn.filtres"></h2><button class="dclose" type="button" data-close="filters" data-i18n-attr="aria-label:drawer.fermer">×</button></div>
  <div class="dbody">
    <div class="grp"><span class="lbl" data-i18n="grp.periode"></span>
      <div class="row" id="eras"></div>
      <div class="row years">
        <label><span data-i18n="periode.de"></span> <select id="yFrom" data-i18n-attr="aria-label:periode.premiere.aria"></select></label>
        <label><span data-i18n="periode.a"></span> <select id="yTo" data-i18n-attr="aria-label:periode.derniere.aria"></select></label>
      </div>
    </div>
    <div class="grp"><span class="lbl" data-i18n="grp.postes"></span><div class="row" id="roles"></div></div>
    <div class="grp"><span class="lbl" data-i18n="grp.regions"></span><div class="row" id="regions"></div></div>
    <div class="grp"><span class="lbl" data-i18n="grp.presence"></span>
      <div class="row" id="presence"></div>
      <!-- Les deux comptes de cette phrase se calculent sur les données, comme ceux des
           pilules : un nombre écrit en dur dans la page se périmerait à la collecte suivante. -->
      <p class="notes" id="presenceNote" style="margin:.4rem 0 0"></p>
    </div>
    <div class="grp"><span class="lbl" data-i18n="grp.equipes"></span>
      <details class="teamlist" id="teamsBox">
        <summary id="teamsSum"></summary>
        <div id="teamsList"></div>
      </details>
    </div>
    <div class="grp"><span class="lbl" data-i18n="grp.options"></span>
      <label class="toggle"><input type="checkbox" id="optNat"> <span data-i18n="opt.nat"></span></label>
      <label class="toggle"><input type="checkbox" id="optSen"> <span data-i18n="opt.sen"></span></label>
    </div>
    <div class="grp"><span class="lbl"><span data-i18n="grp.clicEquipe"></span> <button type="button" class="info" id="modeInfo" aria-expanded="false" aria-controls="modeTip" data-i18n-attr="title:modeInfo.titre">?</button></span>
      <div class="row" id="teamMode"></div>
    </div>
    <details class="notes">
      <summary data-i18n="notes.titre"></summary>
      <ul>
        <li data-i18n-html="notes.rangee"></li>
        <li data-i18n-html="notes.etapes"></li>
        <li data-i18n-html="notes.bouts"></li>
        <li data-i18n-html="notes.demi"></li>
        <li data-i18n-html="notes.repliee"></li>
        <li data-i18n-html="notes.pseudo"></li>
        <li data-i18n-html="notes.recherche"></li>
        <li data-i18n-html="notes.isoler"></li>
        <li data-i18n-html="notes.presence"></li>
        <li data-i18n-html="notes.autres"></li>
        <li data-i18n-html="notes.nationalite"></li>
        <li data-i18n-html="notes.limites"></li>
        <li data-i18n-html="notes.sources"></li>
      </ul>
    </details>
  </div>
</aside>
<div class="tip" id="modeTip" data-i18n-html="modeTip.html" hidden></div>

<aside id="statsDrawer" class="drawer" data-i18n-attr="aria-label:stats.titre">
  <div class="dhead"><h2 data-i18n="stats.titre"></h2><button class="dclose" type="button" data-close="statsDrawer" data-i18n-attr="aria-label:drawer.fermer">×</button></div>
  <div class="dbody">
    <p class="notes" id="statsNote" style="margin:0"></p>
    <div class="stats" id="stats"></div>
  </div>
</aside>

<div id="loadError" class="float load-error" role="alert" hidden>
  <p><b data-i18n="load.titre"></b></p>
  <p data-i18n-html="load.corps"></p>
  <!-- Le message d'erreur contient lui aussi un <code> — celui de `npm run dev` : ce
       conteneur-ci porte donc un id, et non plus le premier `code` de la boîte. -->
  <p class="hint"><span data-i18n="load.detail"></span> <code id="loadDetail"></code></p>
</div>
</body>
</html>
