<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- The map lives in /map/, the data and the assets at the root of the site. This tag is the
       only place that says so: every relative URL of the page as of the app.js module — its
       `fetch("data/*.json")` included — resolves from the root. -->
  <base href="../">
  <title>Rift Transfers</title>
  <!-- The interface text lives in assets/js/i18n.js, and `data-i18n` says which string goes
       where: a string is written only once, in both languages side by side. The metas, for their
       part, also carry their **English** version hard-coded — it is the site's default language,
       and it is what a crawler that does not run the script reads. `data-i18n-attr` names their
       key, `i18n.js` rewrites them at load time as on a language change, and `npm run validate`
       refuses any gap between the two copies. -->
  <meta name="description" data-i18n-attr="content:page.description" content="Interactive map of the rosters of every team that came to the 2011–2026 League of Legends World Championships: follow each player from one team to the next.">
  <meta name="theme-color" content="#171b26" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta property="og:title" content="Rift Transfers">
  <meta property="og:description" data-i18n-attr="content:page.og.description" content="League of Legends Worlds rosters since 2011, and every player's transfers.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Rift Transfers">
  <!-- Link previews (Reddit, Discord, X, Slack…) never run the script and need absolute URLs:
       hence the public address written out here, and not a path relative to <base>. The image
       is a capture of this very map, in English, Fnatic pinned and isolated. -->
  <meta property="og:url" content="https://mrpa2a.github.io/rift-transfers/map/">
  <meta property="og:image" content="https://mrpa2a.github.io/rift-transfers/assets/og-image.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" data-i18n-attr="content:page.og.image.alt" content="The Rift Transfers map with Fnatic selected: coloured threads follow its players to other teams, season after season.">
  <meta property="og:locale" content="en_US">
  <meta property="og:locale:alternate" content="fr_FR">
  <meta name="twitter:card" content="summary_large_image">
  <!-- Language variants, for search engines. Without a build step the language rides on `?lang=`
       rather than on /en/ and /fr/ paths: legitimate, provided each variant says so. `/map/`
       picks the language from the browser, hence x-default; the two `?lang=` URLs are the fixed
       variants. The set is the same on every variant, as hreflang requires — which a static
       <head> gives for free.

       The canonical is **not** written here: it has to name the variant being viewed, and the
       three variants share this one file. `i18n.js` adds it at load time, reading its URL from
       the links below, and Google's guidance is to inject it only if the HTML has none — two
       conflicting canonicals are worse than one late one. -->
  <link rel="alternate" hreflang="x-default" href="https://mrpa2a.github.io/rift-transfers/map/">
  <link rel="alternate" hreflang="en" href="https://mrpa2a.github.io/rift-transfers/map/?lang=en">
  <link rel="alternate" hreflang="fr" href="https://mrpa2a.github.io/rift-transfers/map/?lang=fr">
  <!-- Structured data, in English like the other metas. This page is the application; what it
       publishes, the Dataset, is described once, on the landing page — the page that carries the
       method as real text — and referred to here by its @id. No offers or rating: the application
       rich result would require a rating, and there is none to give. No figures either (120 teams,
       749 players): they would go stale at the next collection run. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "@id": "https://mrpa2a.github.io/rift-transfers/map/#app",
    "name": "Rift Transfers",
    "url": "https://mrpa2a.github.io/rift-transfers/map/",
    "description": "Interactive map of the rosters of every team that came to the 2011–2026 League of Legends World Championships: follow each player from one team to the next.",
    "applicationCategory": "ReferenceApplication",
    "operatingSystem": "Any",
    "browserRequirements": "Requires JavaScript.",
    "inLanguage": ["en", "fr"],
    "isAccessibleForFree": true,
    "image": "https://mrpa2a.github.io/rift-transfers/assets/og-image.png",
    "license": "https://github.com/MrPa2a/rift-transfers/blob/main/LICENSE",
    "creator": { "@type": "Person", "@id": "https://github.com/MrPa2a#person", "name": "MrPa2a", "url": "https://github.com/MrPa2a" },
    "isPartOf": { "@id": "https://mrpa2a.github.io/rift-transfers/#website" },
    "about": { "@id": "https://mrpa2a.github.io/rift-transfers/#dataset" }
  }
  </script>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/barlow-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/barlow-condensed-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script type="module" src="assets/js/app.js"></script>
</head>
<body>
<div id="corner" aria-hidden="true" data-i18n="coin.annee"></div>
<div id="hdr"></div>
<div id="rail"></div>
<div id="vp" tabindex="0" data-i18n-attr="aria-label:vp.aria"><div id="world"></div></div>

<div id="bar" class="float">
  <h1>Rift Transfers</h1>
  <!-- The native <datalist> can neither present two categories, nor display anything other
       than text, nor be styled: since the bar now searches teams as much as players, this is a
       hand-written combobox. -->
  <div class="combo">
    <input id="q" type="text" autocomplete="off" spellcheck="false"
           data-i18n-attr="placeholder:q.aria;aria-label:q.aria"
           role="combobox" aria-expanded="false" aria-controls="qlist" aria-autocomplete="list">
    <div id="qlist" role="listbox" data-i18n-attr="aria-label:qlist.aria" hidden></div>
  </div>
  <button class="ibtn" id="openFilters" type="button" aria-expanded="false" aria-controls="filters" data-i18n-attr="title:btn.filtres.titre">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 4h12M4.5 8h7M7 12h2"/></svg><span data-i18n="btn.filtres"></span></button>
  <button class="ibtn" id="openStats" type="button" aria-expanded="false" aria-controls="statsDrawer" data-i18n-attr="title:btn.stats.titre">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 13V8M8 13V3M13 13V6"/></svg><span data-i18n="btn.stats"></span></button>
  <button class="ibtn" id="openAbout" type="button" aria-expanded="false" aria-controls="aboutDrawer" data-i18n-attr="title:btn.about.titre">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="8" cy="8" r="6.2"/><path d="M8 7.2v4"/><circle cx="8" cy="4.9" r=".4" fill="currentColor"/></svg><span data-i18n="btn.about"></span></button>
  <!-- Two languages, hence a toggle and not a list: the button carries the code of the language
       being **switched to**, which is what it does. Its label stays visible below 700 px, unlike
       those of the two neighbouring buttons — two letters always fit, and a globe on its own
       would not say what one is switching to. -->
  <button class="ibtn" id="lang" type="button" data-i18n-attr="title:btn.lang.titre;aria-label:btn.lang.titre">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="8" cy="8" r="6.2"/><path d="M1.8 8h12.4M8 1.8c1.7 1.7 2.6 3.9 2.6 6.2S9.7 12.5 8 14.2C6.3 12.5 5.4 10.3 5.4 8S6.3 3.5 8 1.8Z"/></svg><span data-i18n="btn.lang.code"></span></button>
  <!-- Replays the guided tour (assets/js/tour.js), which also opens by itself on a first visit.
       The glyph is a symbol, like the zoom buttons' + and −, not text to translate; it sits in a
       <b> rather than a <span> so that it survives the narrow layout, which hides button labels. -->
  <button class="ibtn" id="tourBtn" type="button" data-i18n-attr="title:tour.btn.titre;aria-label:tour.btn.titre"><b aria-hidden="true">?</b></button>
</div>

<div id="zoom" class="float">
  <button type="button" id="zin" data-i18n-attr="title:zoom.in;aria-label:zoom.in">+</button>
  <button type="button" id="zout" data-i18n-attr="title:zoom.out;aria-label:zoom.out">−</button>
  <button type="button" id="zfit" data-i18n-attr="title:zoom.fit;aria-label:zoom.fit"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg></button>
  <div class="pct" id="zpct">100%</div>
</div>

<!-- Closed by default: the legend runs to about ten lines and used to hide the bottom left of
     the map from the start. It stays one click away. -->
<details id="legend" class="float">
  <summary data-i18n="legend.titre"></summary>
  <div id="legendBody"></div>
</details>

<div id="sel" class="float" hidden>
  <div id="selText"></div>
  <!-- Isolate is a toggle, not an action: hence aria-pressed. It lives here because #sel is the
       only place common to both selections — a player is picked up in the map on pointerup, a
       team in the header on click, and a gesture placed on the map would leave the cursor over
       something else once the columns have closed up. -->
  <button id="selIso" type="button" aria-pressed="false" hidden></button>
  <button id="selClose" type="button" data-i18n-attr="aria-label:sel.fermer">×</button>
</div>

<aside id="filters" class="drawer" data-i18n-attr="aria-label:btn.filtres.titre">
  <div class="dhead"><h2 data-i18n="btn.filtres"></h2><button class="dclose" type="button" data-close="filters" data-i18n-attr="aria-label:drawer.fermer">×</button></div>
  <div class="dbody">
    <div class="grp"><span class="lbl" data-i18n="grp.periode"></span>
      <div class="row" id="eras"></div>
      <div class="row years">
        <label><span data-i18n="periode.de"></span> <select id="yFrom" data-i18n-attr="aria-label:periode.premiere.aria"></select></label>
        <label><span data-i18n="periode.a"></span> <select id="yTo" data-i18n-attr="aria-label:periode.derniere.aria"></select></label>
      </div>
    </div>
    <div class="grp"><span class="lbl" data-i18n="grp.postes"></span><div class="row" id="roles"></div></div>
    <div class="grp"><span class="lbl" data-i18n="grp.regions"></span><div class="row" id="regions"></div></div>
    <div class="grp"><span class="lbl" data-i18n="grp.presence"></span>
      <div class="row" id="presence"></div>
      <!-- The two counts in this sentence are computed from the data, like those on the pills:
           a number hard-coded into the page would go stale at the next collection run. -->
      <p class="notes" id="presenceNote" style="margin:.4rem 0 0"></p>
    </div>
    <div class="grp"><span class="lbl" data-i18n="grp.equipes"></span>
      <details class="teamlist" id="teamsBox">
        <summary id="teamsSum"></summary>
        <div id="teamsList"></div>
      </details>
    </div>
    <div class="grp"><span class="lbl" data-i18n="grp.options"></span>
      <label class="toggle"><input type="checkbox" id="optNat"> <span data-i18n="opt.nat"></span></label>
      <label class="toggle"><input type="checkbox" id="optSen"> <span data-i18n="opt.sen"></span></label>
    </div>
    <div class="grp"><span class="lbl"><span data-i18n="grp.clicEquipe"></span> <button type="button" class="info" id="modeInfo" aria-expanded="false" aria-controls="modeTip" data-i18n-attr="title:modeInfo.titre">?</button></span>
      <div class="row" id="teamMode"></div>
    </div>
    <details class="notes">
      <summary data-i18n="notes.titre"></summary>
      <ul>
        <li data-i18n-html="notes.rangee"></li>
        <li data-i18n-html="notes.etapes"></li>
        <li data-i18n-html="notes.bouts"></li>
        <li data-i18n-html="notes.demi"></li>
        <li data-i18n-html="notes.repliee"></li>
        <li data-i18n-html="notes.pseudo"></li>
        <li data-i18n-html="notes.recherche"></li>
        <li data-i18n-html="notes.isoler"></li>
        <li data-i18n-html="notes.presence"></li>
        <li data-i18n-html="notes.autres"></li>
        <li data-i18n-html="notes.nationalite"></li>
        <li data-i18n-html="notes.limites"></li>
        <li data-i18n-html="notes.sources"></li>
      </ul>
    </details>
  </div>
</aside>
<div class="tip" id="modeTip" data-i18n-html="modeTip.html" hidden></div>

<aside id="statsDrawer" class="drawer" data-i18n-attr="aria-label:stats.titre">
  <div class="dhead"><h2 data-i18n="stats.titre"></h2><button class="dclose" type="button" data-close="statsDrawer" data-i18n-attr="aria-label:drawer.fermer">×</button></div>
  <div class="dbody">
    <p class="notes" id="statsNote" style="margin:0"></p>
    <div class="stats" id="stats"></div>
  </div>
</aside>

<!-- "About": the method in three sentences, the two reports, the gestures the guided tour ends
     on, and the credits. Two clicks from the map to a pre-filled issue: this button, then one of
     the two reports — whose `href` is computed by app.js at the moment of the click, from the
     map's live state (assets/js/report.js). The repository URLs are written here rather than in
     the dictionary: a link target is not text to translate. -->
<aside id="aboutDrawer" class="drawer" data-i18n-attr="aria-label:about.titre">
  <div class="dhead"><h2 data-i18n="about.titre"></h2><button class="dclose" type="button" data-close="aboutDrawer" data-i18n-attr="aria-label:drawer.fermer">×</button></div>
  <div class="dbody about">
    <p class="about-lead" data-i18n="page.description"></p>
    <section>
      <h3 data-i18n="about.methode.titre"></h3>
      <p data-i18n-html="about.methode"></p>
      <p class="notes"><a href="https://github.com/MrPa2a/rift-transfers/blob/main/docs/SOURCES.md" target="_blank" rel="noopener" data-i18n="about.sources.lien"></a> <span data-i18n="about.sources.langue"></span></p>
    </section>
    <section>
      <h3 data-i18n="about.signaler.titre"></h3>
      <div class="report">
        <a class="tbtn" id="reportBug" href="https://github.com/MrPa2a/rift-transfers/issues/new/choose" target="_blank" rel="noopener" data-i18n="about.bug"></a>
        <p class="notes" data-i18n="about.bug.note"></p>
        <a class="tbtn" id="reportData" href="https://github.com/MrPa2a/rift-transfers/issues/new/choose" target="_blank" rel="noopener" data-i18n="about.donnees"></a>
        <p class="notes" data-i18n-html="about.donnees.note"></p>
      </div>
      <p class="notes" data-i18n="about.signaler.compte"></p>
    </section>
    <section>
      <h3 data-i18n="recap.titre"></h3>
      <div id="aboutRecap"></div>
    </section>
    <section>
      <h3 data-i18n="about.credits.titre"></h3>
      <ul class="notes">
        <li><span data-i18n="about.licence.code"></span> <a href="https://github.com/MrPa2a/rift-transfers/blob/main/LICENSE" target="_blank" rel="noopener">MIT</a></li>
        <li data-i18n="about.licence.donnees"></li>
        <li><a href="https://github.com/MrPa2a/rift-transfers" target="_blank" rel="noopener" data-i18n="about.depot"></a></li>
        <li data-i18n="about.riot"></li>
        <li data-i18n="about.audience"></li>
      </ul>
    </section>
  </div>
</aside>

<div id="loadError" class="float load-error" role="alert" hidden>
  <p><b data-i18n="load.titre"></b></p>
  <p data-i18n-html="load.corps"></p>
  <!-- The error message contains a <code> of its own — the one for `npm run dev`: so this
       container carries an id, rather than being the box's first `code`. -->
  <p class="hint"><span data-i18n="load.detail"></span> <code id="loadDetail"></code></p>
</div>

<!-- Audience measurement: Cloudflare Web Analytics, the site's one call to a third party. No
     cookie, no local storage, no personal data; the token below is public by design. The landing
     page carries the same tag.

     Here it is added by a script rather than written as a tag, for one reason: the landing page's
     live hero is this very page, framed with `?demo` (assets/js/demo.js). Counted, every visit to
     the landing would also count as a visit to the map. Same attributes as the plain tag, and the
     same test as app.js — `?demo` only counts when the page is framed, so a shared `?demo` link
     is still an ordinary, counted visit. -->
<script>
  if (!(new URLSearchParams(location.search).has("demo") && window.parent !== window)) {
    const s = document.createElement("script");
    s.type = "module";
    s.src = "https://static.cloudflareinsights.com/beacon.min.js";
    s.setAttribute("data-cf-beacon", '{"token": "5c18838c338542daa28d7e3d3eeaffee"}');
    document.body.append(s);
  }
</script>
</body>
</html>
